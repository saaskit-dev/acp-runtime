name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (typecheck)
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Relay worker typecheck
        run: pnpm --filter @saaskit-dev/acp-relay-worker typecheck

      - name: Relay worker test
        run: pnpm --filter @saaskit-dev/acp-relay-worker test
